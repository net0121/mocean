services:
  - type: web
    name: mocean-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: DEV_KEY
        value: "0121"        # unlocks the reserved name "iamdev" (enter in game with /devkey 0121)
