services:
  - type: web
    name: mocean-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: DEV_KEY
        sync: false          # Render asks you for this value; it unlocks the reserved name "iamdev"
